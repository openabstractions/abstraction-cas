name: CodeQL

# Publish as .github/workflows/codeql.yml, then switch repository code scanning
# from default setup to advanced setup. Default setup's dynamic workflow gave
# no file to fix when its "improved incremental analysis" step failed on the
# c-cpp and go jobs: "This job attempted to run with improved incremental
# analysis but it did not complete successfully... This failure has been
# recorded in the Actions cache" (run 34957815028), and the next run failed
# the same way instead of recovering. cas has no cross-repo IPC dependency —
# unlike the service clients on research/ci76/service-codeql.yml, its cpp/
# builds standalone (see cpp/CMakeLists.txt and .github/workflows/build.yml's
# own g++ invocation) — so this workflow compiles it directly and checks out
# no siblings.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ["c-cpp", "go", "python", "actions"]
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: ${{ matrix.language == 'actions' && '.' || github.event.repository.name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.language == 'go'
        with:
          go-version-file: ${{ github.event.repository.name }}/go/go.mod
          cache: false
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          languages: ${{ matrix.language }}
          source-root: ${{ github.workspace }}/${{ matrix.language == 'actions' && '.' || github.event.repository.name }}
          build-mode: ${{ (matrix.language == 'c-cpp' || matrix.language == 'go') && 'manual' || 'none' }}
      - name: compile Go for analysis
        if: matrix.language == 'go'
        working-directory: ${{ github.event.repository.name }}/go
        run: go build -mod=readonly ./...
      - name: compile cas for analysis
        if: matrix.language == 'c-cpp'
        working-directory: ${{ github.event.repository.name }}
        run: g++ -std=c++17 -I cpp/include -c cpp/src/cas.cpp -o "$RUNNER_TEMP/cas.o"
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          category: /language:${{ matrix.language }}
