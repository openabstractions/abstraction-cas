name: build

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The macOS arm64 image carries Go in the tool cache only, so it is on
      # PATH on ubuntu and windows and absent here until an action places it.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache: false
      - name: select verified Windows Go SDK and smoke duplex pipes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 tools/windows_go_sdk.py --cache-dir "$RUNNER_TEMP/windows-go-sdk" --github-env --smoke-dir "$RUNNER_TEMP/windows-go-smoke" > windows-go-sdk-proof.json
          printf '\n### Verified Windows Go SDK and duplex race smoke\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat windows-go-sdk-proof.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: preserve Windows Go SDK source identity and smoke
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-go-sdk-${{ github.job }}-${{ github.run_attempt }}
          path: |
            windows-go-sdk-proof.json
            ${{ runner.temp }}/windows-go-smoke/named-pipe-race.log
            ${{ runner.temp }}/windows-go-smoke/smoke-receipt.json
          if-no-files-found: error

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          go version
          go env CGO_ENABLED GOTOOLCHAIN GOFLAGS

      # No go.work here on purpose. This module resolves whatever it requires
      # from the module proxy, which is the only route a stranger has.
      - name: build and test
        working-directory: go
        run: |
          go build ./...
          n=$(go list -f '{{if .TestGoFiles}}x{{end}}' ./... | grep -c x || true)
          if [ "$n" -lt 1 ]; then
            printf 'FAIL  no package in this module has a test file, and go test calls that a pass\n'
            exit 1
          fi
          go test -count=1 ./...
          printf '%s: %s go packages with tests, resolved as an adopter resolves them\n' \
            "$RUNNER_OS" "$n" >> "$GITHUB_STEP_SUMMARY"

      - name: race
        working-directory: go
        run: |
          if [ "$(go env CGO_ENABLED)" != "1" ]; then
            printf 'UNPROVEN  race detector — CGO_ENABLED=0, no C compiler for go env CC=%s\n' "$(go env CC)"
            printf '%s: UNPROVEN race detector, CGO_ENABLED=0\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go test -race -count=1 ./...
          printf '%s: go tests under the race detector\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: test
        working-directory: python
        run: |
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            printf 'UNPROVEN  python on %s — no interpreter on PATH, nothing was run\n' "$RUNNER_OS"
            printf '%s: UNPROVEN python, no interpreter on PATH\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$PY" --version
          "$PY" -m unittest discover -p 'test_*.py' 2>&1 | tee out.txt
          if grep -q '^Ran 0 tests' out.txt; then
            printf 'FAIL  discovery found no test to run, and unittest calls that a pass\n'
            exit 1
          fi
          printf '%s: python, %s tests\n' \
            "$RUNNER_OS" "$(sed -n 's/^Ran \([0-9]*\) tests\?.*/\1/p' out.txt | tail -1)" >> "$GITHUB_STEP_SUMMARY"

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: abstraction-cas
          persist-credentials: false
      - name: resolve released sibling versions
        id: siblings
        run: |
          version=$(awk '$1 == "github.com/openabstractions/abstraction-identity" {print $2}
                         $1 == "require" && $2 == "github.com/openabstractions/abstraction-identity" {print $3}' abstraction-cas/go/go.mod)
          if ! printf '%s\n' "$version" | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
            printf 'Expected a released abstraction-identity version in go/go.mod\n' >&2
            exit 1
          fi
          printf 'identity=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-identity
          ref: ${{ steps.siblings.outputs.identity }}
          path: abstraction-identity
          persist-credentials: false
      - name: build, install and test C++
        run: |
          prefix="$RUNNER_TEMP/cpp-install"
          cmake -S abstraction-identity/cpp -B "$RUNNER_TEMP/identity-build" \
            -DCMAKE_BUILD_TYPE=Release -DABSTRACTION_IPC_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$RUNNER_TEMP/identity-build" --config Release
          cmake --install "$RUNNER_TEMP/identity-build" --config Release
          cmake -S abstraction-cas/cpp -B "$RUNNER_TEMP/layer-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix" -DABSTRACTION_BUILD_TESTS=ON
          cmake --build "$RUNNER_TEMP/layer-build" --config Release
          ctest --test-dir "$RUNNER_TEMP/layer-build" -C Release --output-on-failure --no-tests=error
          cmake --install "$RUNNER_TEMP/layer-build" --config Release
          cmake -S abstraction-cas/cpp/test/installed -B "$RUNNER_TEMP/consumer-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF
          cmake --build "$RUNNER_TEMP/consumer-build" --config Release
          ctest --test-dir "$RUNNER_TEMP/consumer-build" -C Release --output-on-failure --no-tests=error

  unproven:
    needs: [go, python, cpp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: what this workflow did not run
        run: |
          {
            printf '\n### UNPROVEN\n\nThis workflow builds what this repository contains, and nothing else. It ran none of:\n\n'
            printf -- '- the cross-language conformance harnesses, which compare bytes across all three languages and live in the private tree\n'
            printf -- '- any signed product artefact\n'
            printf -- '- delegation to a real BITS, launchd or NAS tier\n'
          } >> "$GITHUB_STEP_SUMMARY"
