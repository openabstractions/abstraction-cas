[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction-cas-protocol"
version = "0.0.0"
description = "Generated OpenAbstractions compare-and-set record and codec types"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["abstraction.cas*"]
namespaces = true
